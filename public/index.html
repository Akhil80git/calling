<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceConnect</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0f; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; overflow-x:hidden; }

/* ── AUTH SCREENS ── */
#authScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:30px; background:radial-gradient(ellipse at top,#1a1a2e 0%,#0a0a0f 70%); }
.app-logo { width:90px; height:90px; border-radius:28px; background:linear-gradient(135deg,#22c55e,#16a34a); display:flex; align-items:center; justify-content:center; font-size:40px; margin-bottom:24px; box-shadow:0 0 40px rgba(34,197,94,0.4); }
#authScreen h1 { font-size:28px; font-weight:700; margin-bottom:6px; }
#authScreen .tagline { color:#6b7280; margin-bottom:30px; font-size:15px; }

.auth-tabs { display:flex; background:#111827; border-radius:14px; padding:4px; margin-bottom:24px; width:100%; max-width:340px; }
.auth-tab { flex:1; padding:10px; text-align:center; font-size:14px; font-weight:600; color:#6b7280; cursor:pointer; border-radius:10px; border:none; background:none; transition:all 0.2s; }
.auth-tab.active { background:#22c55e; color:#fff; }

.auth-form { width:100%; max-width:340px; display:none; flex-direction:column; gap:14px; }
.auth-form.active { display:flex; }
.input-group input { width:100%; padding:16px 18px; border:1.5px solid #1f2937; border-radius:14px; background:#111827; color:#fff; font-size:16px; outline:none; transition:border-color 0.2s; }
.input-group input:focus { border-color:#22c55e; }
.input-group input::placeholder { color:#4b5563; }
.auth-btn { width:100%; padding:16px; border:none; border-radius:14px; background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; font-size:17px; font-weight:700; cursor:pointer; transition:transform 0.1s; box-shadow:0 4px 20px rgba(34,197,94,0.35); }
.auth-btn:active { transform:scale(0.97); }
.auth-btn:disabled { opacity:0.6; cursor:not-allowed; }
.auth-error { color:#ef4444; font-size:13px; text-align:center; min-height:18px; }

/* ── MAIN APP ── */
#mainApp { display:none; }

.top-bar { display:flex; align-items:center; justify-content:space-between; padding:18px 20px 12px; border-bottom:1px solid #1f2937; }
.top-bar-left { display:flex; align-items:center; gap:12px; }

.profile-btn { position:relative; cursor:pointer; }
.avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#22c55e,#16a34a); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; flex-shrink:0; }
.user-name { font-weight:600; font-size:16px; }
.status-label { font-size:12px; color:#6b7280; }
.status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; margin-right:5px; box-shadow:0 0 6px #22c55e; }

.profile-dropdown { position:absolute; top:54px; left:0; background:#1f2937; border:1px solid #374151; border-radius:16px; min-width:220px; padding:8px; z-index:500; box-shadow:0 8px 32px rgba(0,0,0,0.5); display:none; }
.profile-dropdown.show { display:block; animation:fadeIn 0.15s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.pd-header { padding:12px 14px; border-bottom:1px solid #374151; margin-bottom:6px; }
.pd-header .pd-name { font-weight:700; font-size:15px; }
.pd-header .pd-username { font-size:12px; color:#6b7280; margin-top:2px; }
.pd-item { display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:500; transition:background 0.15s; }
.pd-item:hover { background:#374151; }
.pd-item.danger { color:#ef4444; }
.pd-item .pd-icon { font-size:18px; }

.notif-btn { width:40px; height:40px; border-radius:12px; background:#1f2937; border:none; color:#9ca3af; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
.notif-btn.enabled { color:#22c55e; background:#052e16; }

/* ── TABS ── */
.tabs { display:flex; padding:12px 20px 0; gap:4px; border-bottom:1px solid #1f2937; }
.tab { flex:1; padding:10px; text-align:center; font-size:14px; font-weight:600; color:#6b7280; cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; transition:color 0.2s; }
.tab.active { color:#22c55e; border-bottom-color:#22c55e; }
.tab-content { display:none; padding:16px 20px; }
.tab-content.active { display:block; }
.section-title { font-size:13px; font-weight:600; color:#6b7280; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:12px; }

/* ── USER CARD ── */
.user-card { display:flex; align-items:center; gap:14px; padding:14px; background:#111827; border-radius:16px; margin-bottom:10px; border:1px solid #1f2937; }
.user-card .avatar { width:48px; height:48px; font-size:19px; }
.user-card-info { flex:1; }
.user-card-info .name { font-weight:600; font-size:15px; }
.user-card-info .uname { font-size:12px; color:#6b7280; margin-top:1px; }
.user-card-info .online-txt { font-size:12px; color:#22c55e; margin-top:2px; }
.user-card-info .offline-txt { font-size:12px; color:#6b7280; margin-top:2px; }
.call-btn-small { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#22c55e,#16a34a); border:none; color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 12px rgba(34,197,94,0.4); transition:transform 0.1s; }
.call-btn-small:active { transform:scale(0.9); }

/* ── HISTORY ── */
.history-item { display:flex; align-items:center; gap:14px; padding:14px; background:#111827; border-radius:16px; margin-bottom:10px; border:1px solid #1f2937; }
.history-icon { width:42px; height:42px; border-radius:50%; background:#1f2937; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.history-info .name { font-weight:600; font-size:15px; }
.history-info .dur { font-size:13px; color:#6b7280; margin-top:3px; }
.history-info .time { font-size:12px; color:#4b5563; margin-top:2px; }
.empty-state { text-align:center; padding:40px 0; color:#4b5563; }
.empty-state .icon { font-size:40px; margin-bottom:10px; }
.empty-state p { font-size:14px; }

/* ── CALLING OVERLAY ── */
#callingOverlay { display:none; position:fixed; inset:0; z-index:100; background:linear-gradient(160deg,#0f2027,#203a43,#0f2027); flex-direction:column; align-items:center; justify-content:space-between; padding:80px 30px 60px; }
#callingOverlay.show { display:flex; }
.call-avatar-ring { position:relative; width:130px; height:130px; display:flex; align-items:center; justify-content:center; }
.ring { position:absolute; border-radius:50%; border:2px solid rgba(34,197,94,0.3); animation:ringPulse 1.8s ease-out infinite; }
.ring:nth-child(1){width:130px;height:130px;animation-delay:0s}
.ring:nth-child(2){width:175px;height:175px;animation-delay:0.4s}
.ring:nth-child(3){width:220px;height:220px;animation-delay:0.8s}
@keyframes ringPulse { 0%{opacity:0.7;transform:scale(0.9)} 100%{opacity:0;transform:scale(1.1)} }
.call-avatar-big { width:110px; height:110px; border-radius:50%; background:linear-gradient(135deg,#22c55e,#16a34a); display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:700; z-index:1; box-shadow:0 0 30px rgba(34,197,94,0.4); }
.call-name { font-size:30px; font-weight:700; text-align:center; margin-top:24px; }
.call-status-text { font-size:16px; color:#9ca3af; text-align:center; margin-top:8px; }
.call-timer-big { font-size:22px; font-weight:300; color:#22c55e; letter-spacing:2px; }
.call-actions { display:flex; gap:28px; align-items:center; }
.action-btn { display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; border:none; background:none; }
.action-btn .circle { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; transition:transform 0.15s; }
.action-btn:active .circle { transform:scale(0.9); }
.action-btn .label { font-size:12px; color:#9ca3af; }
.mute-btn .circle { background:#1f2937; }
.speaker-btn .circle { background:#1f2937; }
.end-call-big .circle { background:#ef4444; box-shadow:0 4px 20px rgba(239,68,68,0.5); }
.mute-btn.muted .circle { background:#ef4444; }

/* ── INCOMING OVERLAY ── */
#incomingOverlay { display:none; position:fixed; inset:0; z-index:200; background:linear-gradient(160deg,#1a0a0a,#2d1515,#1a0a0a); flex-direction:column; align-items:center; justify-content:space-between; padding:80px 30px 70px; animation:slideUp 0.3s ease-out; }
#incomingOverlay.show { display:flex; }
@keyframes slideUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
.incoming-label { font-size:14px; color:#ef4444; letter-spacing:1px; text-transform:uppercase; margin-bottom:30px; text-align:center; animation:blink 1s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
.incoming-avatar-wrap { position:relative; width:130px; height:130px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; }
.incoming-ring { position:absolute; border-radius:50%; border:2px solid rgba(239,68,68,0.4); animation:ringRed 1.4s ease-out infinite; }
.incoming-ring:nth-child(1){width:130px;height:130px;animation-delay:0s}
.incoming-ring:nth-child(2){width:175px;height:175px;animation-delay:0.35s}
.incoming-ring:nth-child(3){width:220px;height:220px;animation-delay:0.7s}
@keyframes ringRed { 0%{opacity:0.8;transform:scale(0.9)} 100%{opacity:0;transform:scale(1.1)} }
.incoming-avatar { width:110px; height:110px; border-radius:50%; background:linear-gradient(135deg,#ef4444,#dc2626); display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:700; z-index:1; box-shadow:0 0 30px rgba(239,68,68,0.5); }
.incoming-name { font-size:30px; font-weight:700; text-align:center; }
.incoming-sub { font-size:15px; color:#9ca3af; text-align:center; margin-top:6px; }
.incoming-actions { display:flex; gap:50px; align-items:center; }
.incoming-action { display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; }
.incoming-action .circle { width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; transition:transform 0.15s; }
.incoming-action:active .circle { transform:scale(0.9); }
.decline-btn .circle { background:#ef4444; box-shadow:0 4px 20px rgba(239,68,68,0.5); }
.accept-btn .circle { background:#22c55e; box-shadow:0 4px 20px rgba(34,197,94,0.5); }
.incoming-action .label { font-size:13px; color:#9ca3af; }

/* ── NOTIFICATION BANNER ── */
#notifBanner { position:fixed; top:-100px; left:50%; transform:translateX(-50%); background:#1f2937; border:1px solid #374151; border-radius:16px; padding:14px 20px; display:flex; align-items:center; gap:12px; min-width:300px; z-index:400; transition:top 0.4s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 8px 32px rgba(0,0,0,0.5); white-space:nowrap; }
#notifBanner.show { top:20px; }
#notifBanner .notif-icon { font-size:24px; }
#notifBanner .notif-text .title { font-weight:700; font-size:14px; }
#notifBanner .notif-text .sub { font-size:12px; color:#9ca3af; margin-top:2px; }

/* ── TOAST ── */
#toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#374151; border-radius:12px; padding:12px 20px; font-size:14px; z-index:600; opacity:0; pointer-events:none; transition:opacity 0.3s; white-space:nowrap; }
#toast.show { opacity:1; }

.spinner { display:inline-block; width:18px; height:18px; border:2px solid #ffffff44; border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:8px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── CONNECTION STATUS ── */
#connStatus { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:#1f2937; border-radius:10px; padding:8px 16px; font-size:12px; color:#9ca3af; z-index:300; display:none; }
#connStatus.show { display:block; }
</style>
</head>
<body>

<div id="toast"></div>
<div id="connStatus"></div>

<div id="notifBanner">
  <div class="notif-icon">📞</div>
  <div class="notif-text">
    <div class="title" id="notifTitle">Incoming Call</div>
    <div class="sub" id="notifSub">Someone is calling you</div>
  </div>
</div>

<!-- ═══ AUTH SCREEN ═══ -->

  <div class="auth-tabs">

      <input id="regName" placeholder="Apna naam (display name)" maxlength="20" />

<!-- ═══ MAIN APP ═══ -->
<div id="mainApp">
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="profile-btn" id="profileBtn" onclick="toggleProfileDropdown()">

<div id="callingOverlay">
  <div style="text-align:center">
    <div class="call-avatar-ring">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>

<!-- FIX: audio element with webkit attributes for iOS -->
<audio id="remoteAudio" autoplay playsinline webkit-playsinline></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
// ════════════════════════════════
//  AUDIO ENGINE
// ════════════════════════════════
let audioCtx;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
let ringInterval = null, ringNodes = [];
function playRingtone() {
  stopRingtone();
  function doRing() {
    const ctx = getCtx();
    [[0,0.4],[0.5,0.9]].forEach(([s,e]) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(480, ctx.currentTime+s);
      osc.frequency.setValueAtTime(440, ctx.currentTime+s+0.2);
      gain.gain.setValueAtTime(0.4, ctx.currentTime+s);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+e);
      osc.start(ctx.currentTime+s); osc.stop(ctx.currentTime+e);
      ringNodes.push(osc);
    });
  }
  doRing(); ringInterval = setInterval(doRing, 2000);
}
function stopRingtone() { clearInterval(ringInterval); ringInterval=null; ringNodes.forEach(n=>{try{n.stop()}catch(e){}}); ringNodes=[]; }
let dialInterval = null;
function playDialTone() {
  stopDialTone();
  function beep() {
    const ctx = getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.4);
  }
  beep(); dialInterval = setInterval(beep, 2500);
}
function stopDialTone() { clearInterval(dialInterval); dialInterval=null; }
function playConnectSound() {
  const ctx = getCtx();
  [523,659,784].forEach((freq,i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, ctx.currentTime+i*0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+i*0.12+0.3);
    osc.start(ctx.currentTime+i*0.12); osc.stop(ctx.currentTime+i*0.12+0.4);
  });
}
function playEndSound() {
  const ctx = getCtx();
  [784,523].forEach((freq,i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.2, ctx.currentTime+i*0.15);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+i*0.15+0.25);
    osc.start(ctx.currentTime+i*0.15); osc.stop(ctx.currentTime+i*0.15+0.3);
  });
}

// ════════════════════════════════
//  FIX: iOS AudioContext unlock
//  Mobile par touch karne par AudioContext resume hoga
// ════════════════════════════════
function unlockAudioContext() {
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  // Ek silent buffer play karo — iOS ke liye zaruri hai
  try {
    const ctx = getCtx();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  } catch(e) {}
}
document.addEventListener('touchstart', unlockAudioContext, { once: false });
document.addEventListener('touchend', unlockAudioContext, { once: false });
document.addEventListener('click', unlockAudioContext, { once: false });

// ════════════════════════════════
//  APP STATE
// ════════════════════════════════
const socket = io({
  reconnection: true,
  reconnectionDelay: 1000,
  reconnectionAttempts: Infinity,
});

let localStream, peerConnection;
let currentCallSocketId, currentCallName, currentUserId;
let incomingOffer, incomingCallerName, incomingFromSocket;
let callStartTime, timerInterval;
let isMuted = false, isSpeaker = false;
let myUserId, myName, myUsername, authToken;
let pushEnabled = false;
let pendingCandidates = []; // FIX: ICE candidates queue karo jab tak remoteDescription set na ho

// ════════════════════════════════

  }

  const savedToken = localStorage.getItem("vc_token");
  if (savedToken) {
    try {
      const res = await fetch("/api/me", {
        headers: { "Authorization": "Bearer " + savedToken }
      });

        myName = data.name;

});

async function doRegister() {
  const name = document.getElementById("regName").value.trim();
  const username = document.getElementById("regUsername").value.trim();
  const password = document.getElementById("regPassword").value;
  const errEl = document.getElementById("registerError");
  const btn = document.getElementById("registerBtn");

  errEl.textContent = "";
  if (!name || !username || !password) { errEl.textContent = "Sab fields bharo"; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Registering...';

  try {
    const res = await fetch("/api/register", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ name, username, password })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error; btn.disabled=false; btn.textContent="Register"; return; }

    authToken = data.token;
    myUserId = data.userId;
    myName = data.name;
    myUsername = data.username;
    localStorage.setItem("vc_token", authToken);
    await enterApp();
  } catch(e) {
    errEl.textContent = "Network error";
    btn.disabled=false; btn.textContent="Register";
  }
}

async function enterApp() {
  // FIX: Improved audio constraints for mobile
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,       // Mono — mobile ke liye better bandwidth
        sampleRate: 16000      // 16kHz — voice ke liye kaafi hai, bandwidth kam
      },
      video: false
    });
    console.log("✅ Microphone access mila");
  } catch(e) {
    console.error("Microphone error:", e);
    // Fallback: basic constraints try karo
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      console.log("✅ Microphone access mila (basic mode)");
    } catch(e2) {
      showToast("⚠️ Microphone access chahiye calls ke liye!");
    }
  }

  document.getElementById("myAvatar").textContent = myName[0].toUpperCase();
  document.getElementById("myName").textContent = myName;
  document.getElementById("pdName").textContent = myName;
  document.getElementById("pdUsername").textContent = "@" + myUsername;

  document.getElementById("authScreen").style.display = "none";
  document.getElementById("mainApp").style.display = "block";

  socket.emit("socket-auth", authToken);

  // FIX: iOS remote audio unlock — pehle touch pe audio context resume karo
  const remoteAudio = document.getElementById("remoteAudio");
  document.addEventListener("touchstart", function iosAudioUnlock() {
    remoteAudio.play().catch(() => {});
    unlockAudioContext();
  }, { once: false });

  if ("Notification" in window && "serviceWorker" in navigator) {
    if (Notification.permission === "granted") {
      await setupPushSubscription();
      markPushEnabled();
    } else if (Notification.permission === "default") {
      try {
        const perm = await Notification.requestPermission();
        if (perm === "granted") {
          await setupPushSubscription();
          markPushEnabled();
          showToast("✅ Notifications enable ho gayi!");
        }
      } catch(e) {
        console.warn("Notification permission request failed:", e);
      }
    }
  }
}

async function enablePush() {
  document.getElementById("profileDropdown").classList.remove("show");
  if (!("Notification" in window)) { showToast("Browser push notifications support nahi karta"); return; }
  if (Notification.permission === "denied") { showToast("Notifications blocked hain — browser settings mein allow karo"); return; }

  const permission = await Notification.requestPermission();
  if (permission !== "granted") { showToast("Notification permission nahi mila"); return; }

  await setupPushSubscription();
  markPushEnabled();
  showToast("✅ Push notifications enable ho gayi!");
}

async function setupPushSubscription() {
  try {
    const sw = await navigator.serviceWorker.ready;
    const vapidRes = await fetch("/api/vapid-key");
    const { publicKey } = await vapidRes.json();

    let sub = await sw.pushManager.getSubscription();
    if (!sub) {
      sub = await sw.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
    }

    const res = await fetch("/api/push-subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
      body: JSON.stringify({ subscription: sub })
    });
    if (!res.ok) throw new Error("Save failed");
    console.log("✅ Push subscription saved");
  } catch(e) {
    console.warn("Push subscription failed:", e);
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// ════════════════════════════════
//  FIX: PEER CONNECTION — improved for mobile
// ════════════════════════════════
function createPeer() {
  // Purana connection close karo
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  pendingCandidates = [];

  peerConnection = new RTCPeerConnection(servers);

  // FIX: localStream tracks add karo
  if (localStream) {
    localStream.getTracks().forEach(track => {
      peerConnection.addTrack(track, localStream);
    });
  }

  // FIX: Remote audio properly set karo aur iOS ke liye force play
  peerConnection.ontrack = (e) => {
    console.log("✅ Remote track mila:", e.track.kind);
    const remoteAudio = document.getElementById("remoteAudio");
    if (e.streams && e.streams[0]) {
      remoteAudio.srcObject = e.streams[0];
    } else {
      // FIX: Stream nahi hai to manually add karo
      const stream = new MediaStream();
      stream.addTrack(e.track);
      remoteAudio.srcObject = stream;
    }
    // FIX: iOS par audio play force karo
    remoteAudio.play().catch(err => {
      console.warn("Remote audio play failed (will retry on interaction):", err);
      // User interaction pe retry
      document.addEventListener('touchstart', () => remoteAudio.play(), { once: true });
      document.addEventListener('click', () => remoteAudio.play(), { once: true });
    });
  };

  peerConnection.onicecandidate = (e) => {
    if (e.candidate) {
      console.log("ICE candidate:", e.candidate.type, e.candidate.protocol);
      socket.emit("ice-candidate", { to: currentCallSocketId, candidate: e.candidate });
    }
  };

  // FIX: ICE gathering state monitor karo
  peerConnection.onicegatheringstatechange = () => {
    console.log("ICE gathering state:", peerConnection?.iceGatheringState);
  };

  peerConnection.oniceconnectionstatechange = () => {
    const state = peerConnection?.iceConnectionState;
    console.log("ICE connection state:", state);

    const statusEl = document.getElementById("connStatus");
    if (state === "checking") {
      statusEl.textContent = "🔄 Connecting...";
      statusEl.classList.add("show");
    } else if (state === "connected" || state === "completed") {
      statusEl.textContent = "✅ Connected";
      statusEl.classList.add("show");
      setTimeout(() => statusEl.classList.remove("show"), 2000);
    } else if (state === "failed") {
      statusEl.textContent = "❌ Connection failed";
      statusEl.classList.add("show");
      showToast("⚠️ Connection fail — retry kar raha hai...");
      // FIX: ICE restart karo
      if (peerConnection) {
        peerConnection.restartIce();
      }
    } else if (state === "disconnected") {
      statusEl.textContent = "⚠️ Reconnecting...";
      statusEl.classList.add("show");
    }
  };

  peerConnection.onconnectionstatechange = () => {
    const state = peerConnection?.connectionState;
    console.log("Connection state:", state);
    if (state === "failed") {
      showToast("Connection fail ho gayi — call end ho rahi hai");
      endCall();
    }
  };

  // FIX: Signaling state monitor karo
  peerConnection.onsignalingstatechange = () => {
    console.log("Signaling state:", peerConnection?.signalingState);
  };
}

// FIX: ICE candidates queue — remoteDescription set hone ke baad apply karo
async function addQueuedCandidates() {
  if (!peerConnection || pendingCandidates.length === 0) return;
  console.log(`Applying ${pendingCandidates.length} queued ICE candidates`);
  for (const candidate of pendingCandidates) {
    try {
      await peerConnection.addIceCandidate(candidate);
    } catch(e) {
      console.warn("ICE candidate add failed:", e);
    }
  }
  pendingCandidates = [];
}

// ════════════════════════════════
//  OUTGOING CALL
// ════════════════════════════════
async function callUser(userId, name, socketId) {
  unlockAudioContext(); // FIX: call shuru karne pe audio unlock karo
  currentUserId = userId;
  currentCallSocketId = socketId;
  currentCallName = name;

  createPeer();

  // FIX: Offer options — audio only, proper codec hints
  const offer = await peerConnection.createOffer({
    offerToReceiveAudio: true,
    offerToReceiveVideo: false,
    voiceActivityDetection: true
  });

  // FIX: SDP modify karo — mobile ke liye Opus codec prefer karo
  offer.sdp = preferOpusCodec(offer.sdp);

  await peerConnection.setLocalDescription(offer);
  socket.emit("call-user", { toUserId: userId, offer: peerConnection.localDescription, callerName: myName });

  document.getElementById("callAvatarBig").textContent = name[0].toUpperCase();
  document.getElementById("callNameBig").textContent = name;
  document.getElementById("callStatusText").textContent = "Calling...";
  document.getElementById("callTimerBig").textContent = "00:00";
  document.getElementById("callingOverlay").classList.add("show");
  playDialTone();
}

socket.on("user-offline", ({ name, pushSent }) => {
  stopDialTone();
  document.getElementById("callingOverlay").classList.remove("show");
  if (peerConnection) { peerConnection.close(); peerConnection = null; }

  if (pushSent) {
    showBanner(`📴 ${name} abhi offline hai`, "Push notification bhej di gayi hai");
    showToast(`📲 ${name} ko notification bhej di`);
  } else {
    showBanner(`📴 ${name} offline hai`, "Notifications bhi enable nahi hain");
    showToast(`${name} offline hai aur notifications bhi band hain`);
  }
});

// ════════════════════════════════
//  INCOMING CALL
// ════════════════════════════════
socket.on("incoming-call", ({ from, offer, callerName }) => {
  unlockAudioContext(); // FIX: incoming call pe audio unlock
  if (peerConnection) {
    socket.emit("reject-call", { to: from });
    return;
  }

  currentCallSocketId = from;
  incomingOffer = offer;
  incomingCallerName = callerName;
  incomingFromSocket = from;

  document.getElementById("incomingAvatar").textContent = callerName[0].toUpperCase();
  document.getElementById("incomingName").textContent = callerName;
  document.getElementById("incomingOverlay").classList.add("show");

  playRingtone();
  showBanner(`📞 ${callerName} calling...`, "Accept ya Decline karo");
});

async function acceptCall() {
  unlockAudioContext(); // FIX: accept karne pe audio unlock
  stopRingtone();
  document.getElementById("incomingOverlay").classList.remove("show");

  createPeer();

  // FIX: Remote description set karo pehle
  await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));

  // FIX: Queued candidates apply karo
  await addQueuedCandidates();

  const answer = await peerConnection.createAnswer();

  // FIX: SDP modify — Opus codec prefer karo
  answer.sdp = preferOpusCodec(answer.sdp);

  await peerConnection.setLocalDescription(answer);
  socket.emit("answer-call", { to: incomingFromSocket, answer: peerConnection.localDescription });

  currentCallSocketId = incomingFromSocket;
  currentCallName = incomingCallerName;

  document.getElementById("callAvatarBig").textContent = incomingCallerName[0].toUpperCase();
  document.getElementById("callNameBig").textContent = incomingCallerName;
  document.getElementById("callStatusText").textContent = "Connected";
  document.getElementById("callTimerBig").textContent = "00:00";
  document.getElementById("callingOverlay").classList.add("show");

  playConnectSound();
  startTimer();
}

function rejectCall() {
  stopRingtone();
  socket.emit("reject-call", { to: incomingFromSocket });
  document.getElementById("incomingOverlay").classList.remove("show");
  playEndSound();
}

socket.on("call-rejected", () => {
  stopDialTone();
  document.getElementById("callingOverlay").classList.remove("show");
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  playEndSound();
  showBanner("Call Decline Ho Gaya", "Doosre ne call decline ki");
  showToast("Call decline ho gayi");
});

socket.on("call-answered", async (answer) => {
  stopDialTone();
  try {
    // FIX: Sirf tabhi set karo agar state sahi ho
    if (peerConnection && peerConnection.signalingState === "have-local-offer") {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
      // FIX: Queued candidates apply karo
      await addQueuedCandidates();
      document.getElementById("callStatusText").textContent = "Connected";
      playConnectSound();
      startTimer();
    }
  } catch(e) {
    console.error("Error setting remote description:", e);
    showToast("Connection mein problem — call dobara karo");
    closeCall();
  }
});

// FIX: Speaker toggle — Android/iOS pe setSinkId use karo
async function toggleSpeaker() {
  isSpeaker = !isSpeaker;
  const btn = document.getElementById("speakerBtn");
  const audio = document.getElementById("remoteAudio");
  btn.querySelector(".label").textContent = isSpeaker ? "Earpiece" : "Speaker";
  btn.querySelector(".circle").textContent = isSpeaker ? "🔇" : "🔊";

  // FIX: setSinkId support check karo
  if (audio.setSinkId) {
    try {
      // Speaker = default (built-in speaker), Earpiece = communications device
      await audio.setSinkId(isSpeaker ? "default" : "communications");
      showToast(isSpeaker ? "🔊 Speaker on" : "📱 Earpiece mode");
    } catch(e) {
      console.warn("setSinkId failed:", e);
      showToast(isSpeaker ? "🔊 Speaker mode" : "📱 Earpiece mode");
    }
  } else {
    showToast(isSpeaker ? "🔊 Speaker mode" : "📱 Earpiece mode");
  }
}

function endCall() {
  socket.emit("end-call", { to: currentCallSocketId });
  saveHistory();
  closeCall();
}

socket.on("call-ended", () => {
  saveHistory();
  closeCall();
  showBanner("Call Khatam", "Doosre ne call end ki");
});

function closeCall() {
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  pendingCandidates = [];
  clearInterval(timerInterval); timerInterval = null;
  document.getElementById("callTimerBig").textContent = "00:00";
  document.getElementById("callingOverlay").classList.remove("show");
  document.getElementById("incomingOverlay").classList.remove("show");
  stopRingtone(); stopDialTone();
  isMuted = false; isSpeaker = false;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = true);
  const btn = document.getElementById("muteBtn");
  btn.querySelector(".circle").textContent = "🎤";
  btn.querySelector(".label").textContent = "Mute";
  btn.classList.remove("muted");
  document.getElementById("speakerBtn").querySelector(".circle").textContent = "🔊";
  document.getElementById("speakerBtn").querySelector(".label").textContent = "Speaker";

  // FIX: Remote audio reset karo
  const remoteAudio = document.getElementById("remoteAudio");
  remoteAudio.srcObject = null;

  playEndSound();
}

// ════════════════════════════════
//  TIMER
// ════════════════════════════════
function startTimer() {
  callStartTime = Date.now();
  timerInterval = setInterval(() => {
    const d = Math.floor((Date.now()-callStartTime)/1000);
    const m = String(Math.floor(d/60)).padStart(2,"0");
    const s = String(d%60).padStart(2,"0");
    document.getElementById("callTimerBig").textContent = `${m}:${s}`;
  }, 1000);
}

// ════════════════════════════════
//  HISTORY
// ════════════════════════════════
function saveHistory() {
  const dur = document.getElementById("callTimerBig").textContent;
  if (dur === "00:00") return;
  const other = document.getElementById("callNameBig").textContent;
  socket.emit("save-call-history", {
    callerName: myName,
    receiverName: other || "Unknown",
    duration: dur
  });
}

socket.on("call-history", (history) => {
  const list = document.getElementById("historyList");
  list.innerHTML = "";
  if (!history.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>Abhi koi call nahi hui</p></div>`;
    return;
  }
  history.forEach(item => {
    const t = new Date(item.createdAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    const d = new Date(item.createdAt).toLocaleDateString([],{day:"2-digit",month:"short"});
    list.innerHTML += `
      <div class="history-item">
        <div class="history-icon">📞</div>
        <div class="history-info">
          <div class="name">${esc(item.callerName)} → ${esc(item.receiverName)}</div>
          <div class="dur">Duration: ${item.duration}</div>
          <div class="time">${d} at ${t}</div>
        </div>
      </div>`;
  });
});

// ════════════════════════════════
//  FIX: ICE candidates — queue karo jab tak remote set na ho
// ════════════════════════════════
socket.on("ice-candidate", async (candidate) => {
  if (!peerConnection) return;
  try {
    // FIX: Remote description set hai tabhi add karo, warna queue mein daalo
    if (peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
      await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    } else {
      console.log("ICE candidate queue mein daala (remote desc pending)");
      pendingCandidates.push(new RTCIceCandidate(candidate));
    }
  } catch(e) {
    console.warn("ICE candidate add failed:", e);
  }
});

// ════════════════════════════════
//  FIX: Opus codec preference — mobile ke liye best audio codec
// ════════════════════════════════
function preferOpusCodec(sdp) {
  const lines = sdp.split('\n');
  const mLineIndex = lines.findIndex(line => line.startsWith('m=audio'));
  if (mLineIndex === -1) return sdp;

  // Opus payload type dhundo
  let opusPayload = null;
  lines.forEach(line => {
    const match = line.match(/a=rtpmap:(\d+) opus/i);
    if (match) opusPayload = match[1];
  });

  if (!opusPayload) return sdp;

  // m= line mein Opus ko pehle rakh do
  const mLine = lines[mLineIndex];
  const parts = mLine.split(' ');
  const filteredPayloads = parts.slice(3).filter(p => p.trim() !== opusPayload);
  lines[mLineIndex] = parts.slice(0, 3).concat([opusPayload, ...filteredPayloads]).join(' ');

  // FIX: Opus parameters add karo — mobile ke liye optimized
  const opusFmtpIndex = lines.findIndex(line => line.includes(`a=fmtp:${opusPayload}`));
  const opusParams = `a=fmtp:${opusPayload} minptime=10;useinbandfec=1;stereo=0;maxaveragebitrate=32000`;
  if (opusFmtpIndex !== -1) {
    lines[opusFmtpIndex] = opusParams;
  } else {
    const rtpmapIndex = lines.findIndex(line => line.includes(`a=rtpmap:${opusPayload}`));
    if (rtpmapIndex !== -1) lines.splice(rtpmapIndex + 1, 0, opusParams);
  }

  return lines.join('\n');
}
