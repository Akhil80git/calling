<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VoiceConnect</title>
<link rel="manifest" href="/manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap');

:root {
  --green:   #22c55e;
  --green2:  #16a34a;
  --red:     #ef4444;
  --red2:    #dc2626;
  --bg:      #0a0a0f;
  --surface: #111827;
  --border:  #1f2937;
  --border2: #374151;
  --muted:   #6b7280;
  --muted2:  #4b5563;
  --text:    #f9fafb;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Sora', -apple-system, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  overscroll-behavior: none;
}

/* ══ SCROLLBAR ══ */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#374151; border-radius:4px; }

/* ══════════════════════
   AUTH SCREEN
══════════════════════ */
#authScreen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 30px 24px;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, #0d2a1f 0%, var(--bg) 70%);
  animation: fadeScreen 0.4s ease;
}
@keyframes fadeScreen { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

.app-logo {
  width: 88px; height: 88px;
  border-radius: 26px;
  background: linear-gradient(135deg, var(--green), var(--green2));
  display: flex; align-items: center; justify-content: center;
  font-size: 38px;
  margin-bottom: 20px;
  box-shadow: 0 0 50px rgba(34,197,94,0.35), 0 0 120px rgba(34,197,94,0.12);
  animation: logoFloat 3s ease-in-out infinite;
}
@keyframes logoFloat {
  0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}
}

#authScreen h1 { font-size: 30px; font-weight: 800; letter-spacing:-0.5px; }
.tagline { color: var(--muted); margin-bottom: 32px; font-size: 14px; margin-top: 4px; }

.auth-tabs {
  display: flex;
  background: var(--surface);
  border-radius: 14px;
  padding: 4px;
  margin-bottom: 22px;
  width: 100%; max-width: 340px;
  border: 1px solid var(--border);
}
.auth-tab {
  flex: 1; padding: 11px;
  text-align: center;
  font-size: 14px; font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  border-radius: 10px;
  border: none; background: none;
  transition: all 0.25s ease;
  font-family: inherit;
}
.auth-tab.active {
  background: linear-gradient(135deg, var(--green), var(--green2));
  color: #fff;
  box-shadow: 0 2px 12px rgba(34,197,94,0.4);
}

.auth-form { width:100%; max-width:340px; display:none; flex-direction:column; gap:12px; }
.auth-form.active { display:flex; animation:fadeScreen 0.3s ease; }

.input-wrap { position:relative; }
.input-wrap input {
  width: 100%;
  padding: 15px 18px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
.input-wrap input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(34,197,94,0.12);
}
.input-wrap input::placeholder { color: var(--muted2); }

.auth-btn {
  width: 100%; padding: 15px;
  border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--green), var(--green2));
  color: #fff; font-size: 16px; font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.2s;
  box-shadow: 0 4px 24px rgba(34,197,94,0.35);
  font-family: inherit;
  letter-spacing: 0.3px;
}
.auth-btn:active { transform: scale(0.97); }
.auth-btn:disabled { opacity:0.6; cursor:not-allowed; }
.auth-error { color:var(--red); font-size:13px; text-align:center; min-height:18px; }

/* ══════════════════════
   MAIN APP
══════════════════════ */
#mainApp { display:none; min-height:100vh; }

/* TOP BAR */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 52px 20px 14px;          /* safe area top */
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,15,0.8);
  backdrop-filter: blur(12px);
  position: sticky; top:0; z-index:50;
}
.top-bar-left { display:flex; align-items:center; gap:12px; }

.avatar {
  width:44px; height:44px;
  border-radius:50%;
  background: linear-gradient(135deg, var(--green), var(--green2));
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:18px; flex-shrink:0;
  cursor:pointer; user-select:none;
}
.user-name { font-weight:700; font-size:15px; }
.status-label { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:4px; margin-top:2px; }
.status-dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* PROFILE DROPDOWN */
.profile-btn { position:relative; }
.profile-dropdown {
  position: absolute; top: 56px; left: 0;
  background: #1a2332; border: 1px solid var(--border2);
  border-radius: 16px; min-width: 230px; padding:8px;
  z-index: 500; box-shadow:0 12px 40px rgba(0,0,0,0.6);
  display:none; transform-origin:top left;
}
.profile-dropdown.show { display:block; animation:dropIn 0.18s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes dropIn { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
.pd-header { padding:12px 14px 10px; border-bottom:1px solid var(--border); margin-bottom:6px; }
.pd-name { font-weight:700; font-size:15px; }
.pd-username { font-size:12px; color:var(--muted); margin-top:2px; }
.pd-item {
  display:flex; align-items:center; gap:10px;
  padding:11px 14px; border-radius:10px;
  cursor:pointer; font-size:14px; font-weight:600;
  transition:background 0.15s;
}
.pd-item:hover { background:var(--border); }
.pd-item.danger { color:var(--red); }
.pd-icon { font-size:17px; }

/* NOTIF BTN */
.notif-btn {
  width:42px; height:42px; border-radius:12px;
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s;
}
.notif-btn.enabled { color:var(--green); background:#052e16; border-color:#14532d; }

/* TABS */
.tabs {
  display:flex; padding:14px 20px 0; gap:4px;
  border-bottom:1px solid var(--border);
}
.tab {
  flex:1; padding:11px; text-align:center;
  font-size:14px; font-weight:700; color:var(--muted);
  cursor:pointer; border-bottom:2px solid transparent;
  background:none; border-top:none; border-left:none; border-right:none;
  transition:color 0.2s; font-family:inherit;
}
.tab.active { color:var(--green); border-bottom-color:var(--green); }

.tab-content { display:none; padding:18px 20px; }
.tab-content.active { display:block; animation:fadeScreen 0.25s ease; }
.section-title {
  font-size:11px; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:1px; margin-bottom:14px;
}

/* USER CARD */
.user-card {
  display:flex; align-items:center; gap:14px;
  padding:14px 16px; background:var(--surface);
  border-radius:16px; margin-bottom:10px;
  border:1px solid var(--border);
  transition:border-color 0.2s, transform 0.1s;
}
.user-card:active { transform:scale(0.99); }
.user-card:hover { border-color:var(--border2); }
.uc-info { flex:1; min-width:0; }
.uc-name { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.uc-uname { font-size:12px; color:var(--muted); margin-top:2px; }
.uc-online { font-size:12px; color:var(--green); margin-top:3px; }
.uc-offline { font-size:12px; color:var(--muted); margin-top:3px; }

.call-btn {
  width:46px; height:46px; border-radius:50%;
  background:linear-gradient(135deg, var(--green), var(--green2));
  border:none; color:#fff; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 16px rgba(34,197,94,0.4);
  transition:transform 0.15s, box-shadow 0.15s;
  flex-shrink:0;
}
.call-btn:active { transform:scale(0.88); box-shadow:none; }

/* HISTORY */
.history-item {
  display:flex; align-items:center; gap:14px;
  padding:14px 16px; background:var(--surface);
  border-radius:16px; margin-bottom:10px;
  border:1px solid var(--border);
}
.history-icon {
  width:44px; height:44px; border-radius:50%;
  background:#1f2937; display:flex; align-items:center;
  justify-content:center; font-size:18px; flex-shrink:0;
}
.history-info .hi-name { font-weight:700; font-size:14px; }
.history-info .hi-dur { font-size:13px; color:var(--muted); margin-top:3px; }
.history-info .hi-time { font-size:11px; color:var(--muted2); margin-top:2px; }

.empty-state { text-align:center; padding:48px 0; color:var(--muted2); }
.empty-state .es-icon { font-size:44px; margin-bottom:12px; }
.empty-state p { font-size:14px; }

/* ══════════════════════
   CALLING OVERLAY
══════════════════════ */
#callingOverlay {
  display:none; position:fixed; inset:0; z-index:100;
  background:linear-gradient(170deg,#071c12,#0f2d1e,#071c12);
  flex-direction:column; align-items:center;
  justify-content:space-between; padding:90px 30px 70px;
}
#callingOverlay.show { display:flex; animation:fadeScreen 0.3s ease; }

.call-avatar-ring {
  position:relative; width:140px; height:140px;
  display:flex; align-items:center; justify-content:center;
}
.ring {
  position:absolute; border-radius:50%;
  border:2px solid rgba(34,197,94,0.25);
  animation:ringOut 2s ease-out infinite;
}
.ring:nth-child(1){width:140px;height:140px;animation-delay:0s}
.ring:nth-child(2){width:190px;height:190px;animation-delay:0.5s}
.ring:nth-child(3){width:240px;height:240px;animation-delay:1s}
@keyframes ringOut { 0%{opacity:0.8;transform:scale(0.88)} 100%{opacity:0;transform:scale(1.12)} }

.call-avatar-big {
  width:116px; height:116px; border-radius:50%;
  background:linear-gradient(135deg, var(--green), var(--green2));
  display:flex; align-items:center; justify-content:center;
  font-size:46px; font-weight:800; z-index:1;
  box-shadow:0 0 40px rgba(34,197,94,0.5);
}
.call-name { font-size:30px; font-weight:800; text-align:center; margin-top:22px; letter-spacing:-0.5px; }
.call-status { font-size:15px; color:#9ca3af; text-align:center; margin-top:8px; }
.call-timer {
  font-size:28px; font-weight:300; color:var(--green);
  letter-spacing:3px; font-variant-numeric:tabular-nums;
}

/* AUDIO VISUALIZER (mic activity) */
.audio-vis {
  display:flex; align-items:flex-end; gap:4px; height:28px;
  opacity:0; transition:opacity 0.3s;
}
.audio-vis.active { opacity:1; }
.vis-bar {
  width:4px; background:var(--green); border-radius:2px;
  animation:visAnim 0.6s ease-in-out infinite alternate;
}
.vis-bar:nth-child(1){height:8px; animation-delay:0s}
.vis-bar:nth-child(2){height:18px;animation-delay:0.1s}
.vis-bar:nth-child(3){height:26px;animation-delay:0.2s}
.vis-bar:nth-child(4){height:18px;animation-delay:0.3s}
.vis-bar:nth-child(5){height:8px; animation-delay:0.4s}
@keyframes visAnim { from{transform:scaleY(0.3)} to{transform:scaleY(1)} }

.call-actions { display:flex; gap:30px; align-items:center; }
.action-btn {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer; border:none; background:none;
  font-family:inherit;
}
.action-btn .ab-circle {
  width:66px; height:66px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:26px; transition:transform 0.15s;
}
.action-btn:active .ab-circle { transform:scale(0.88); }
.action-btn .ab-label { font-size:12px; color:#9ca3af; font-weight:600; }
.btn-mute .ab-circle  { background:#1f2937; }
.btn-spk  .ab-circle  { background:#1f2937; }
.btn-end  .ab-circle  { background:var(--red); box-shadow:0 4px 24px rgba(239,68,68,0.5); }
.btn-mute.muted .ab-circle { background:var(--red); }

/* ══════════════════════
   INCOMING OVERLAY
══════════════════════ */
#incomingOverlay {
  display:none; position:fixed; inset:0; z-index:200;
  background:linear-gradient(170deg,#1c0707,#2d1515,#1c0707);
  flex-direction:column; align-items:center;
  justify-content:space-between; padding:90px 30px 70px;
}
#incomingOverlay.show { display:flex; animation:slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes slideUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }

.incoming-label {
  font-size:13px; color:var(--red); letter-spacing:2px;
  text-transform:uppercase; text-align:center;
  font-weight:700;
  animation:blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

.inc-ring-wrap {
  position:relative; width:140px; height:140px; margin:0 auto;
  display:flex; align-items:center; justify-content:center;
}
.inc-ring {
  position:absolute; border-radius:50%;
  border:2px solid rgba(239,68,68,0.3);
  animation:ringRed 1.5s ease-out infinite;
}
.inc-ring:nth-child(1){width:140px;height:140px;animation-delay:0s}
.inc-ring:nth-child(2){width:190px;height:190px;animation-delay:0.4s}
.inc-ring:nth-child(3){width:240px;height:240px;animation-delay:0.8s}
@keyframes ringRed { 0%{opacity:0.9;transform:scale(0.88)} 100%{opacity:0;transform:scale(1.12)} }

.inc-avatar {
  width:116px; height:116px; border-radius:50%;
  background:linear-gradient(135deg, var(--red), var(--red2));
  display:flex; align-items:center; justify-content:center;
  font-size:46px; font-weight:800; z-index:1;
  box-shadow:0 0 40px rgba(239,68,68,0.5);
}
.inc-name { font-size:30px; font-weight:800; text-align:center; margin-top:20px; letter-spacing:-0.5px; }
.inc-sub { font-size:15px; color:#9ca3af; text-align:center; margin-top:6px; }

.inc-actions { display:flex; gap:56px; align-items:center; }
.inc-action { display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; user-select:none; }
.inc-action .ia-circle {
  width:76px; height:76px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:32px; transition:transform 0.15s;
}
.inc-action:active .ia-circle { transform:scale(0.88); }
.inc-action .ia-label { font-size:13px; color:#9ca3af; font-weight:600; }
.ia-decline .ia-circle { background:var(--red);   box-shadow:0 4px 24px rgba(239,68,68,0.5); }
.ia-accept  .ia-circle { background:var(--green); box-shadow:0 4px 24px rgba(34,197,94,0.5); }

/* ══════════════════════
   NOTIFICATION BANNER
══════════════════════ */
#notifBanner {
  position:fixed; top:-110px; left:50%; transform:translateX(-50%);
  background:#1a2332; border:1px solid var(--border2);
  border-radius:18px; padding:14px 20px;
  display:flex; align-items:center; gap:12px;
  min-width:300px; max-width:92vw; z-index:400;
  transition:top 0.45s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 8px 40px rgba(0,0,0,0.6);
  white-space:nowrap;
}
#notifBanner.show { top:20px; }
.nb-icon { font-size:26px; }
.nb-title { font-weight:700; font-size:14px; }
.nb-sub   { font-size:12px; color:#9ca3af; margin-top:2px; }

/* ══ TOAST ══ */
#toast {
  position:fixed; bottom:36px; left:50%; transform:translateX(-50%);
  background:#374151; border-radius:14px; padding:12px 22px;
  font-size:14px; font-weight:600; z-index:600;
  opacity:0; pointer-events:none;
  transition:opacity 0.3s, transform 0.3s;
  white-space:nowrap; max-width:92vw;
}
#toast.show { opacity:1; }

/* ══ SPINNER ══ */
.spin {
  display:inline-block; width:16px; height:16px;
  border:2px solid #ffffff44; border-top-color:#fff;
  border-radius:50%; animation:spinR 0.7s linear infinite;
  vertical-align:middle; margin-right:8px;
}
@keyframes spinR { to{transform:rotate(360deg)} }

/* ══ CONNECTION STATUS ══ */
#connStatus {
  position:fixed; bottom:0; left:0; right:0;
  background:#7c2d12; color:#fed7aa;
  text-align:center; font-size:13px; font-weight:600;
  padding:8px; z-index:300;
  transform:translateY(100%); transition:transform 0.3s;
}
#connStatus.show { transform:translateY(0); }
</style>
</head>
<body>

<!-- TOAST -->
<div id="toast"></div>

<!-- NOTIFICATION BANNER -->
<div id="notifBanner">
  <div class="nb-icon">📞</div>
  <div>
    <div class="nb-title" id="nbTitle">Incoming Call</div>
    <div class="nb-sub"   id="nbSub">Someone is calling</div>
  </div>
</div>

<!-- DISCONNECTED BANNER -->
<div id="connStatus">⚠️ Connection lost — reconnecting...</div>

<!-- ═══ AUTH SCREEN ═══ -->
<div id="authScreen">
  <div class="app-logo">📞</div>
  <h1>VoiceConnect</h1>
  <p class="tagline">Crystal clear voice calls</p>

  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
    <button class="auth-tab"        onclick="switchAuthTab('register')">Register</button>
  </div>

  <!-- LOGIN -->
  <div class="auth-form active" id="loginForm">
    <div class="input-wrap">
      <input id="loginUser" placeholder="Username" autocomplete="username" />
    </div>
    <div class="input-wrap">
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
    </div>
    <p class="auth-error" id="loginErr"></p>
    <button class="auth-btn" id="loginBtn" onclick="doLogin()">Login</button>
  </div>

  <!-- REGISTER -->
  <div class="auth-form" id="registerForm">
    <div class="input-wrap">
      <input id="regName" placeholder="Display name" maxlength="20" />
    </div>
    <div class="input-wrap">
      <input id="regUser" placeholder="Username (3+ chars)" maxlength="20" autocomplete="username" />
    </div>
    <div class="input-wrap">
      <input id="regPass" type="password" placeholder="Password (6+ chars)" autocomplete="new-password" />
    </div>
    <p class="auth-error" id="registerErr"></p>
    <button class="auth-btn" id="registerBtn" onclick="doRegister()">Register</button>
  </div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div id="mainApp">
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="profile-btn" id="profileBtn" onclick="togglePD()">
        <div class="avatar" id="myAvatar">?</div>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="pd-header">
            <div class="pd-name" id="pdName">Name</div>
            <div class="pd-username" id="pdUname">@username</div>
          </div>
          <div class="pd-item" onclick="enablePush()">
            <span class="pd-icon">🔔</span> Enable Notifications
          </div>
          <div class="pd-item" onclick="testAudio()">
            <span class="pd-icon">🔊</span> Test Audio
          </div>
          <div class="pd-item danger" onclick="doLogout()">
            <span class="pd-icon">🚪</span> Logout
          </div>
        </div>
      </div>
      <div>
        <div class="user-name" id="myName">You</div>
        <div class="status-label"><span class="status-dot"></span>Online</div>
      </div>
    </div>
    <button class="notif-btn" id="notifBtn" onclick="enablePush()" title="Enable Push Notifications">🔔</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('contacts')">Contacts</button>
    <button class="tab"        onclick="switchTab('history')">History</button>
  </div>

  <div id="contactsTab" class="tab-content active">
    <div class="section-title">All Users</div>
    <div id="usersList"></div>
  </div>

  <div id="historyTab" class="tab-content">
    <div class="section-title">Recent Calls</div>
    <div id="historyList"></div>
  </div>
</div>

<!-- ═══ CALLING OVERLAY ═══ -->
<div id="callingOverlay">
  <div style="text-align:center">
    <div class="call-avatar-ring">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="call-avatar-big" id="callAvatar">?</div>
    </div>
    <div class="call-name"   id="callName">Unknown</div>
    <div class="call-status" id="callStatus">Calling...</div>
    <!-- Audio visualizer — connected hone pe dikhta hai -->
    <div class="audio-vis" id="audioVis">

// ════════════════════════════════════════════════════
//  AUDIO ENGINE
//  Ringtone, dial tone, connect/end sounds
// ════════════════════════════════════════════════════
let audioCtx;
function getCtx() {
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  // Resume if suspended (browser policy)
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// ─── Ringtone (incoming) ─────────────────────────────
let ringInterval = null, ringNodes = [];
function playRingtone() {
  stopRingtone();
  function oneRing() {
    const ctx = getCtx();
    [[0,0.45],[0.55,1.0]].forEach(([start, end]) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(520, ctx.currentTime + start);
      osc.frequency.setValueAtTime(460, ctx.currentTime + start + 0.22);
      gain.gain.setValueAtTime(0.45, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + end);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + end);
      ringNodes.push(osc);
    });
  }
  oneRing();
  ringInterval = setInterval(oneRing, 2200);
}
function stopRingtone() {
  clearInterval(ringInterval); ringInterval = null;
  ringNodes.forEach(n => { try { n.stop(); } catch(e) {} });
  ringNodes = [];
}

// ─── Dial tone (outgoing) ────────────────────────────
let dialInterval = null;
function playDialTone() {
  stopDialTone();
  function beep() {
    const ctx = getCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  }
  beep();
  dialInterval = setInterval(beep, 2600);
}
function stopDialTone() {
  clearInterval(dialInterval); dialInterval = null;
}

// ─── Connect / End sounds ────────────────────────────
function playConnectSound() {
  const ctx = getCtx();
  [523, 659, 784].forEach((freq, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.28, ctx.currentTime + i * 0.13);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.13 + 0.3);
    osc.start(ctx.currentTime + i * 0.13);
    osc.stop(ctx.currentTime  + i * 0.13 + 0.35);
  });
}
function playEndSound() {
  const ctx = getCtx();
  [784, 523].forEach((freq, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.16);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.16 + 0.28);
    osc.start(ctx.currentTime + i * 0.16);
    osc.stop(ctx.currentTime  + i * 0.16 + 0.32);
  });
}

// ════════════════════════════════════════════════════
//  AUTO-LOGIN — localStorage token se instant login
//  Token JWT hai, decode karke expiry check karo
// ════════════════════════════════════════════════════
window.addEventListener('load', async () => {
  // 1. Service Worker register karo
  if ('serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      console.log('✅ SW registered:', reg.scope);

      // SW se messages sun (notification actions)
      navigator.serviceWorker.addEventListener('message', handleSWMessage);

      // SW update check
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage({ type: 'skip-waiting' });
          }
        });
      });
    } catch(e) {
      console.warn('SW registration failed:', e);
    }
  }

  // 2. Saved token se auto-login (FAST — no loading screen)
  const saved = localStorage.getItem('vc_token');
  if (saved) {
    // Pehle token validate karo (expiry check)
    try {
      const payload = JSON.parse(atob(saved.split('.')[1]));
      if (payload.exp && Date.now() / 1000 > payload.exp) {
        // Token expired
        localStorage.removeItem('vc_token');
      } else {
        // Token valid lag raha hai — server se verify karo
        const res = await fetch('/api/me', {
          headers: { 'Authorization': 'Bearer ' + saved }
        });
        if (res.ok) {
          const data = await res.json();
          authToken  = saved;
          myUserId   = data.userId;
          myName     = data.name;
          myUsername = data.username;
          await enterApp();
          return;
        }
        localStorage.removeItem('vc_token');
      }
    } catch(e) {
      localStorage.removeItem('vc_token');
    }
  }
});

// ════════════════════════════════════════════════════
//  SERVICE WORKER MESSAGE HANDLER
//  Notification actions (accept/decline) handle karo
// ════════════════════════════════════════════════════
function handleSWMessage(event) {
  const { type, action, caller, notifType } = event.data || {};

  if (type === 'notification-action') {
    if (action === 'accept' && incomingOffer) {
      // User ne notification se accept kiya
      acceptCall();
    } else if (action === 'decline' && incomingFromSock) {
      rejectCall();
    }
  }

  if (type === 'push-in-app') {
    // App open hai, push directly received
    const d = event.data.data || {};
    showBanner(`📞 ${d.caller || 'Someone'} calling...`, d.body || 'Incoming call');
  }
}

async function doRegister() {

  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const errEl    = document.getElementById('registerErr');
  const btn      = document.getElementById('registerBtn');

  errEl.textContent = '';
  if (!name || !username || !password) { errEl.textContent = 'Sab fields bharo'; return; }
  if (username.length < 3) { errEl.textContent = 'Username 3+ chars hona chahiye'; return; }
  if (password.length < 6) { errEl.textContent = 'Password 6+ chars hona chahiye'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Registering...';

  try {
    const res  = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, username, password })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error; btn.disabled=false; btn.textContent='Register'; return; }

    authToken  = data.token;
    myUserId   = data.userId;
    myName     = data.name;
    myUsername = data.username;

    await enterApp();
  } catch(e) {
    errEl.textContent = 'Network error — dobara try karo';
    btn.disabled=false; btn.textContent='Register';
  }
}

// ════════════════════════════════════════════════════
async function initPush() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return;

  if (Notification.permission === 'granted') {
    await setupPushSub();
    markPushOn();
  } else if (Notification.permission === 'default') {
    // First time — auto request
    try {
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        await setupPushSub();
        markPushOn();
        showToast('✅ Notifications on! Ab call aane pe phone bajega.');
      }
    } catch(e) {}
  }
}

async function enablePush() {
  document.getElementById('profileDropdown').classList.remove('show');
  if (!('Notification' in window)) {
    showToast('Aapka browser notifications support nahi karta');
    return;
  }
  if (Notification.permission === 'denied') {
    showToast('Notifications blocked hain — browser settings se allow karo');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { showToast('Notification permission nahi mila'); return; }
  await setupPushSub();
  markPushOn();
  showToast('✅ Push notifications enable! App band hone pe bhi call aayegi.');
}

function markPushOn() {
  pushEnabled = true;
  const btn = document.getElementById('notifBtn');
  btn.classList.add('enabled');
  btn.title = 'Notifications enabled ✓';
}

async function setupPushSub() {
  try {
    const sw   = await navigator.serviceWorker.ready;
    const vRes = await fetch('/api/vapid-key');
    const { publicKey } = await vRes.json();

    let sub = await sw.pushManager.getSubscription();
    if (!sub) {
      sub = await sw.pushManager.subscribe({
        userVisibleOnly:      true,
        applicationServerKey: urlB64ToUint8(publicKey)
      });
    }

    const res = await fetch('/api/push-subscribe', {
      method: 'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ subscription: sub })
    });
    if (!res.ok) throw new Error('Save failed');
    console.log('✅ Push subscription saved');
  } catch(e) {
    console.warn('Push sub failed:', e);
  }
}

function urlB64ToUint8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const b   = atob((b64 + pad).replace(/-/g,'+').replace(/_/g,'/'));
  const out = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) out[i] = b.charCodeAt(i);
  return out;
}

// ════════════════════════════════════════════════════
//  WEBRTC — PEER CONNECTION
//  Audio dono taraf jaaye/aaye
// ════════════════════════════════════════════════════
function createPeer() {
  // Pehle purana connection band karo
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }

  peerConnection = new RTCPeerConnection(servers);

  // LOCAL AUDIO TRACKS ADD KARO — yahan se awaaz jaayegi
  if (localStream) {
    localStream.getTracks().forEach(track => {
      peerConnection.addTrack(track, localStream);
    });
  } else {
    console.warn('⚠️ localStream nahi hai — mic access tha nahi');
  }

  // REMOTE AUDIO — yahan se awaaz aayegi (Bluetooth/speaker/earpiece)
  peerConnection.ontrack = event => {
    console.log('🔊 Remote track received:', event.track.kind);
    const audio = document.getElementById('remoteAudio');
    if (event.streams && event.streams[0]) {
      audio.srcObject = event.streams[0];
    } else {
      // Fallback — stream ke bina track
      const ms = new MediaStream();
      ms.addTrack(event.track);
      audio.srcObject = ms;
    }
    // Play karo (autoplay blocked ho sakta hai)
    audio.play().catch(e => {
      console.warn('Audio play blocked:', e);
      // User interaction pe play karo
      document.addEventListener('click', () => audio.play(), { once: true });
    });
  };

  // ICE candidates exchange
  peerConnection.onicecandidate = event => {
    if (event.candidate) {
      socket.emit('ice-candidate', {
        to:        currentCallSockId,
        candidate: event.candidate
      });
    }
  };

  // ICE gathering state
  peerConnection.onicegatheringstatechange = () => {
    console.log('ICE gathering:', peerConnection?.iceGatheringState);
  };

  // Connection state change
  peerConnection.onconnectionstatechange = () => {
    const state = peerConnection?.connectionState;
    console.log('Connection state:', state);
    if (state === 'connected') {
      document.getElementById('callStatus').textContent = 'Connected';
      document.getElementById('audioVis').classList.add('active');
    }
    if (state === 'failed' || state === 'disconnected') {
      showToast('⚠️ Connection issue — call end ho rahi hai');
      endCall();
    }
  };

  // ICE connection state
  peerConnection.oniceconnectionstatechange = () => {
    console.log('ICE connection:', peerConnection?.iceConnectionState);
  };

  return peerConnection;
}

// ════════════════════════════════════════════════════
//  OUTGOING CALL
// ════════════════════════════════════════════════════
async function startCall(userId, name, socketId) {
  // Pehle se call chal rahi hai?
  if (peerConnection) {
    showToast('Ek call pehle se chal rahi hai');
    return;
  }

  // AudioContext resume karo (browser policy)
  getCtx();

  currentCallSockId = socketId;
  currentCallName   = name;

  createPeer();

  // Offer create karo
  const offer = await peerConnection.createOffer({
    offerToReceiveAudio: true,
    offerToReceiveVideo: false
  });
  await peerConnection.setLocalDescription(offer);

  socket.emit('call-user', {
    toUserId:   userId,
    offer,
    callerName: myName
  });

  // UI update
  document.getElementById('callAvatar').textContent = name[0].toUpperCase();
  document.getElementById('callName').textContent   = name;
  document.getElementById('callStatus').textContent = 'Calling...';
  document.getElementById('callTimer').textContent  = '00:00';
  document.getElementById('audioVis').classList.remove('active');
  document.getElementById('callingOverlay').classList.add('show');
  playDialTone();
}

// User offline — push gaya?
socket.on('user-offline', ({ name, pushSent }) => {
  stopDialTone();
  document.getElementById('callingOverlay').classList.remove('show');
  if (peerConnection) { peerConnection.close(); peerConnection = null; }

  if (pushSent) {
    showBanner(`📴 ${name} offline hai`, 'Push notification bhej di gayi unke phone pe 📲');
    showToast(`📲 ${name} ko notification gayi — woh aane pe call kar sakte hain`);
  } else {
    showBanner(`📴 ${name} offline hai`, 'Unke paas notifications bhi enable nahi hain');
    showToast(`${name} offline hai`);
  }
});

// ════════════════════════════════════════════════════
//  INCOMING CALL
// ════════════════════════════════════════════════════
socket.on('incoming-call', ({ from, offer, callerName }) => {
  // Already in a call?
  if (peerConnection) {
    socket.emit('reject-call', { to: from });
    return;
  }

  getCtx(); // AudioContext unlock karo

  currentCallSockId  = from;
  incomingOffer      = offer;
  incomingCallerName = callerName;
  incomingFromSock   = from;

  document.getElementById('incAvatar').textContent = callerName[0].toUpperCase();
  document.getElementById('incName').textContent   = callerName;
  document.getElementById('incomingOverlay').classList.add('show');

  playRingtone();
  showBanner(`📞 ${callerName} calling...`, 'Accept ya Decline karo');
});

// ─── ACCEPT CALL ─────────────────────────────────────
async function acceptCall() {
  stopRingtone();
  document.getElementById('incomingOverlay').classList.remove('show');

  createPeer();

  // Remote description set karo (caller ki offer)
  await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));

  // Answer create karo
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);

  socket.emit('answer-call', {
    to:     incomingFromSock,
    answer
  });

  currentCallSockId = incomingFromSock;
  currentCallName   = incomingCallerName;

  document.getElementById('callAvatar').textContent = incomingCallerName[0].toUpperCase();
  document.getElementById('callName').textContent   = incomingCallerName;
  document.getElementById('callStatus').textContent = 'Connecting...';
  document.getElementById('callTimer').textContent  = '00:00';
  document.getElementById('audioVis').classList.remove('active');
  document.getElementById('callingOverlay').classList.add('show');

  playConnectSound();
  startTimer();
}

// ─── REJECT CALL ─────────────────────────────────────
function rejectCall() {
  stopRingtone();
  socket.emit('reject-call', { to: incomingFromSock });
  document.getElementById('incomingOverlay').classList.remove('show');
  incomingOffer      = null;
  incomingCallerName = null;
  incomingFromSock   = null;
  playEndSound();
}

socket.on('call-rejected', () => {
  stopDialTone();
  document.getElementById('callingOverlay').classList.remove('show');
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  playEndSound();
  showBanner('📵 Call Decline Hua', 'Doosre ne call decline ki');
  showToast('Call decline ho gayi');
});

// ─── CALL ANSWERED (caller side) ─────────────────────
socket.on('call-answered', async answer => {
  stopDialTone();
  try {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
  } catch(e) {
    console.error('setRemoteDescription failed:', e);
  }
  document.getElementById('callStatus').textContent = 'Connecting...';
  playConnectSound();
  startTimer();
});

// ─── ICE CANDIDATES ──────────────────────────────────
socket.on('ice-candidate', async candidate => {
  try {
    if (peerConnection && peerConnection.remoteDescription) {
      await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    }
  } catch(e) {
    console.warn('addIceCandidate failed:', e);
  }
});

// ════════════════════════════════════════════════════
//  IN-CALL CONTROLS
// ════════════════════════════════════════════════════
function toggleMute() {
  isMuted = !isMuted;
  if (localStream) {
    localStream.getAudioTracks().forEach(track => {
      track.enabled = !isMuted;
    });
  }
  const btn = document.getElementById('muteBtn');
  btn.querySelector('.ab-circle').textContent = isMuted ? '🔇' : '🎤';
  btn.querySelector('.ab-label').textContent  = isMuted ? 'Unmute' : 'Mute';
  btn.classList.toggle('muted', isMuted);
  showToast(isMuted ? '🔇 Muted' : '🎤 Unmuted');
}

function endCall() {
  socket.emit('end-call', { to: currentCallSockId });
  saveCallHistory();
  closeCall();
}

socket.on('call-ended', () => {
  saveCallHistory();
  closeCall();
  showBanner('📵 Call Khatam', 'Doosre ne call end ki');
});

function closeCall() {
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  clearInterval(timerInterval); timerInterval = null;

  // Remote audio stop karo
  const audio    = document.getElementById('remoteAudio');
  audio.srcObject = null;

  document.getElementById('callTimer').textContent  = '00:00';
  document.getElementById('callingOverlay').classList.remove('show');
  document.getElementById('incomingOverlay').classList.remove('show');
  document.getElementById('audioVis').classList.remove('active');

  stopRingtone(); stopDialTone();

  // Mute reset
  isMuted = false;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = true);
  const btn = document.getElementById('muteBtn');
  btn.querySelector('.ab-circle').textContent = '🎤';
  btn.querySelector('.ab-label').textContent  = 'Mute';
  btn.classList.remove('muted');

  // Speaker reset
  usingSpeaker = false;
  const spkBtn = document.getElementById('speakerBtn');
  spkBtn.querySelector('.ab-circle').textContent = '🔊';
  spkBtn.querySelector('.ab-label').textContent  = 'Speaker';

  // Incoming state reset
  incomingOffer      = null;
  incomingCallerName = null;
  incomingFromSock   = null;
  currentCallSockId  = null;

  playEndSound();
}

// ════════════════════════════════════════════════════
//  CALL TIMER
// ════════════════════════════════════════════════════
function startTimer() {
  callStartTime = Date.now();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('callTimer').textContent = `${m}:${s}`;
  }, 1000);
}

// ════════════════════════════════════════════════════
//  CALL HISTORY
// ════════════════════════════════════════════════════
function saveCallHistory() {
  const dur  = document.getElementById('callTimer').textContent;
  if (dur === '00:00') return;  // 0s calls save nahi karenge
  const other = document.getElementById('callName').textContent;
  socket.emit('save-call-history', {
    callerName:   myName,
    receiverName: other || 'Unknown',
    duration:     dur
  });
}

socket.on('call-history', history => {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  if (!history.length) {
    list.innerHTML = `<div class="empty-state"><div class="es-icon">📋</div><p>Abhi koi call nahi hui</p></div>`;
    return;
  }
  history.forEach(item => {
    const t = new Date(item.createdAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    const d = new Date(item.createdAt).toLocaleDateString([], { day:'2-digit', month:'short' });
    list.innerHTML += `
      <div class="history-item">
        <div class="history-icon">📞</div>
        <div class="history-info">
          <div class="hi-name">${esc(item.callerName)} → ${esc(item.receiverName)}</div>
          <div class="hi-dur">⏱ ${item.duration}</div>
          <div class="hi-time">${d} • ${t}</div>
        </div>
      </div>`;
  });
});

// ════════════════════════════════════════════════════
//  VISIBILITY CHANGE — tab/app wapas aane pe re-auth
// ════════════════════════════════════════════════════
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && authToken && socket.connected) {
    socket.emit('socket-auth', authToken);
  }
});
</script>
